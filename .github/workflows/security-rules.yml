name: Firebase security rules
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
        working-directory: diary-app/security-tests
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-webapp-hub "node --test security-tests/rules.integration.mjs"
        working-directory: diary-app

